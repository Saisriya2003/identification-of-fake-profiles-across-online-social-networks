name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI + NumPy ANN)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import app and load trained weights
        run: python -c "from app.main import app; print('routes:', len(app.routes))"
      - name: Smoke test API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8001/api/metrics | head -c 300; echo
          curl -sf -X POST http://127.0.0.1:8001/api/predict -H 'Content-Type: application/json' \
            -d '{"follower_count":120,"following_count":3400,"friends_count":12,"posts_count":2,"account_age_days":8,"has_profile_photo":0,"has_cover_photo":0,"bio_length":3,"username_digit_ratio":0.6,"username_length":14,"friend_request_mutuals":0,"avg_likes_per_post":1,"posts_per_week":0.2}'
          echo

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
